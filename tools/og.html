<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>J3D1.FM social card</title>
    <!-- Source of public/og.png. Render at 1200x630; see TECHNICAL_DOCUMENTATION.txt, SOCIAL CARD. -->
    <style>
      @font-face {
        font-family: "Space Grotesk";
        src: url("../app/fonts/space-grotesk.woff2") format("woff2");
        font-weight: 300 700;
      }

      @font-face {
        font-family: "JetBrains Mono";
        src: url("../app/fonts/jetbrains-mono.woff2") format("woff2");
        font-weight: 400 700;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        background:
          radial-gradient(ellipse 620px 410px at 1040px 40px, rgba(124, 123, 255, 0.17), transparent 70%),
          radial-gradient(ellipse 570px 345px at 80px 575px, rgba(201, 255, 63, 0.07), transparent 70%),
          #05070a;
        color: #f2f1e8;
        font-family: "Space Grotesk", sans-serif;
      }

      .wordmark {
        position: absolute;
        left: 64px;
        top: 61px;
        font-size: 34px;
        line-height: 1;
        font-weight: 700;
        letter-spacing: -0.05em;
      }

      .wordmark span,
      h1 span {
        color: #c9ff3f;
      }

      .mono {
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        line-height: 1;
        font-weight: 500;
        font-style: italic;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .live {
        position: absolute;
        right: 64px;
        top: 71px;
        display: flex;
        align-items: center;
        gap: 12px;
        color: #969b90;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #c9ff3f;
        box-shadow: 0 0 18px #c9ff3f;
        transform: translateY(-1px);
      }

      h1 {
        position: absolute;
        left: 64px;
        top: 163px;
        font-size: 148px;
        line-height: 121px;
        font-weight: 700;
        letter-spacing: -0.06em;
        text-transform: uppercase;
      }

      h1 span {
        display: block;
        transform: translateX(66px);
        text-shadow: 0 0 60px rgba(201, 255, 63, 0.35);
      }

      .rule {
        position: absolute;
        left: 64px;
        right: 64px;
        top: 531px;
        height: 1px;
        background: rgba(242, 241, 232, 0.14);
      }

      .caption {
        position: absolute;
        top: 561px;
      }

      .caption-left {
        left: 64px;
        color: #969b90;
      }

      .caption-right {
        right: 64px;
        color: #c9ff3f;
      }
    </style>
  </head>
  <body>
    <div class="wordmark">J3D1<span>.FM</span></div>
    <div class="live mono"><span class="dot"></span>Live signal</div>
    <h1>Signal<span>over noise</span></h1>
    <div class="rule"></div>
    <div class="caption caption-left mono">Independent frequency</div>
    <div class="caption caption-right mono">101.3 · on air</div>
  </body>
</html>
